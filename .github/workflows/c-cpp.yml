name: C/C++ CI

on:
  pull_request:
    branches: [ "master" ]

jobs:
  test:

    runs-on: [self-hosted, linux]

    steps:
    - uses: actions/checkout@v3
    - name: Install autoconf-archive
      run: sudo apt-get install -y autoconf-archive
    - name: autoreconf
      run: autoreconf --install
    - name: configure
      run: ./configure
    - name: make
      run: make
    - name: testsuite
      run: ./tests/testsuite.sh
